<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #0f766e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #0f766e;
            margin-bottom: 8px;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #0f766e;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        #loginMessage {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0f766e;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">ই</div>

        <h1>অ্যাডমিন লগইন</h1>

        <p class="subtitle">
            ইসলামপুর উচ্চ বিদ্যালয়
        </p>

        <form id="loginForm">

            <label for="userId">User ID</label>

            <input
                type="text"
                id="userId"
                placeholder="User ID লিখুন"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Password লিখুন"
                required
            >

            <button type="submit">
                লগইন করুন
            </button>

            <div id="loginMessage"></div>

        </form>

        <a href="index.html" class="back">
            ← মূল ওয়েবসাইটে ফিরে যান
        </a>

    </div>

    <script src="login.js"></script>

</body>
</html>
