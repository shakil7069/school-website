<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>লগইন | ইসলামপুর উচ্চ বিদ্যালয়</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-wrap {
      min-height: 80vh;
      display: grid;
      place-items: center;
      padding: 25px;
    }
    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px #00000012;
    }
    .login-card h1 {
      text-align: center;
      color: #063b75;
      margin-bottom: 8px;
    }
    .login-card p {
      text-align: center;
      color: #777;
    }
    .login-card button {
      width: 100%;
      margin-top: 12px;
    }
    #message {
      margin-top: 15px;
      text-align: center;
      color: #b42318;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🏫 ইসলামপুর উচ্চ বিদ্যালয়</div>
  <nav><a href="index.html">হোমপেজ</a></nav>
</header>

<main class="login-wrap">
  <section class="login-card">
    <h1>অ্যাকাউন্ট লগইন</h1>
    <p>শিক্ষক ও অ্যাডমিনের জন্য</p>

    <form id="loginForm">
      <label for="email">ইমেইল ঠিকানা</label>
      <input type="email" id="email" required
        placeholder="আপনার ইমেইল">

      <label for="password">পাসওয়ার্ড</label>
      <input type="password" id="password" required
        placeholder="আপনার পাসওয়ার্ড">

      <button type="submit" class="admin-btn" id="loginBtn">
        লগইন করুন
      </button>
    </form>

    <button id="resetBtn" class="btn">
      পাসওয়ার্ড ভুলে গেছেন?
    </button>

    <div id="message" role="status"></div>
  </section>
</main>

<footer>
  <p>© ইসলামপুর উচ্চ বিদ্যালয়</p>
</footer>

<script type="module" src="login.js"></script>
